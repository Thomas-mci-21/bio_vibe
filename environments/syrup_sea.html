<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>糖浆海 - 异星环境基座</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #120816;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  .planet {
    position: relative;
    width: min(94vw, 980px);
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(circle at 72% 20%, rgba(255, 216, 142, 0.18), transparent 24%),
      radial-gradient(circle at 18% 72%, rgba(219, 129, 255, 0.2), transparent 28%),
      linear-gradient(180deg, #2b1238 0%, #4e2769 34%, #7f58a2 68%, #c39bd6 100%);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42), inset 0 0 90px rgba(54, 12, 64, 0.45);
  }
  .label {
    position: absolute;
    top: 18px;
    left: 22px;
    z-index: 20;
    color: rgba(255, 246, 252, 0.86);
    font-size: 14px;
  }
  .viscous-layer {
    position: absolute;
    inset: 0;
    background:
      repeating-radial-gradient(ellipse at 50% 70%, transparent 0 22px, rgba(255, 255, 255, 0.07) 24px 27px, transparent 31px 62px);
    opacity: 0.72;
    animation: slowWarp 9s ease-in-out infinite;
  }
  @keyframes slowWarp {
    0%, 100% { transform: scale(1) translateY(0); filter: blur(0); }
    50% { transform: scale(1.04, 1.1) translateY(-12px); filter: blur(1px); }
  }
  .wave {
    position: absolute;
    left: -12%;
    width: 124%;
    height: 10px;
    border-radius: 999px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255, 247, 224, 0.42), transparent 72%);
    animation: wave 7s ease-in-out infinite;
  }
  .w1 { top: 25%; animation-duration: 9s; }
  .w2 { top: 42%; animation-duration: 7s; animation-delay: 1s; }
  .w3 { top: 60%; animation-duration: 11s; animation-delay: 2.2s; }
  .w4 { top: 77%; animation-duration: 8s; animation-delay: 3.4s; }
  @keyframes wave {
    0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.32; }
    50% { transform: translateY(-16px) scaleY(2.2); opacity: 0.72; }
  }
  .filament, .nutrient {
    position: absolute;
    pointer-events: none;
  }
  .filament {
    width: 2px;
    height: 86px;
    border-radius: 999px;
    background: linear-gradient(to bottom, rgba(255, 250, 230, 0.68), transparent);
    transform-origin: top;
    animation: sway 8s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-14px); }
  }
  .nutrient {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 130, 0.95), rgba(209, 143, 46, 0.52) 58%, transparent 76%);
    box-shadow: 0 0 16px rgba(255, 218, 103, 0.45);
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(18px, -14px); }
    50% { transform: translate(-12px, -30px); }
    75% { transform: translate(-20px, -8px); }
  }
  .stage {
    position: absolute;
    top: 52%;
    left: 50%;
    z-index: 12;
    width: min(34%, 330px);
    aspect-ratio: 1 / 0.88;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    text-align: center;
    color: rgba(255, 246, 252, 0.92);
    border: 3px dashed rgba(255, 246, 252, 0.52);
    border-radius: 8px;
    background: rgba(31, 10, 40, 0.28);
    animation: breathe 3.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 18px rgba(218, 156, 255, 0.16); }
    50% { box-shadow: 0 0 40px rgba(218, 156, 255, 0.38); }
  }
  .stage strong { display: block; font-size: 22px; margin-bottom: 8px; }
  .stage small { color: rgba(255, 246, 252, 0.68); line-height: 1.7; }
</style>
</head>
<body>
<main class="planet" id="planet" aria-label="糖浆海环境">
  <div class="label">糖浆海 / 低重力、高粘度液体、悬浮营养物</div>
  <div class="viscous-layer" aria-hidden="true"></div>
  <div class="wave w1" aria-hidden="true"></div>
  <div class="wave w2" aria-hidden="true"></div>
  <div class="wave w3" aria-hidden="true"></div>
  <div class="wave w4" aria-hidden="true"></div>
  <section class="stage" id="creature-stage">
    <div><strong>异星生物舞台</strong><small>学生将在这里加入滤食、浮力控制或波动推进型生物</small></div>
  </section>
</main>
<script>
  const planet = document.getElementById("planet");
  for (let i = 0; i < 18; i++) {
    const f = document.createElement("i");
    f.className = "filament";
    f.style.left = `${6 + Math.random() * 88}%`;
    f.style.top = `${12 + Math.random() * 66}%`;
    f.style.height = `${42 + Math.random() * 110}px`;
    f.style.animationDuration = `${6 + Math.random() * 7}s`;
    f.style.animationDelay = `${Math.random() * 5}s`;
    planet.appendChild(f);
  }
  for (let i = 0; i < 34; i++) {
    const n = document.createElement("i");
    n.className = "nutrient";
    const size = 6 + Math.random() * 19;
    n.style.width = `${size}px`;
    n.style.height = `${size}px`;
    n.style.left = `${5 + Math.random() * 90}%`;
    n.style.top = `${14 + Math.random() * 76}%`;
    n.style.animationDuration = `${5 + Math.random() * 8}s`;
    n.style.animationDelay = `${Math.random() * 6}s`;
    planet.appendChild(n);
  }
</script>
</body>
</html>
