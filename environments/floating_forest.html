<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮空林 - 异星环境基座</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #07110d;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  .planet {
    position: relative;
    width: min(94vw, 980px);
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(circle at 62% 18%, rgba(255, 237, 176, 0.42), transparent 18%),
      radial-gradient(circle at 16% 26%, rgba(173, 221, 255, 0.25), transparent 22%),
      linear-gradient(180deg, #142a1d 0%, #2d5440 30%, #72a984 68%, #c6ead2 100%);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.38), inset 0 0 80px rgba(0, 0, 0, 0.18);
  }
  .label {
    position: absolute;
    top: 18px;
    left: 22px;
    z-index: 20;
    color: rgba(247, 255, 245, 0.86);
    font-size: 14px;
  }
  .glow {
    position: absolute;
    top: 6%;
    left: 56%;
    width: 22%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 247, 198, 0.55), transparent 70%);
    filter: blur(14px);
  }
  .canopy {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(ellipse at 45% 58%, rgba(42, 88, 52, 0.9), rgba(18, 48, 30, 0.58) 60%, transparent 78%);
    filter: drop-shadow(0 18px 20px rgba(19, 43, 26, 0.26));
    animation: sway ease-in-out infinite;
  }
  .c1 { width: 22%; height: 12%; top: 8%; left: 4%; animation-duration: 8s; }
  .c2 { width: 18%; height: 10%; top: 13%; right: 9%; animation-duration: 9s; animation-delay: 1.8s; }
  .c3 { width: 14%; height: 8%; top: 4%; left: 38%; animation-duration: 10s; animation-delay: 3s; }
  .c4 { width: 30%; height: 16%; bottom: 14%; left: 1%; animation-duration: 11s; animation-delay: 0.6s; }
  .c5 { width: 20%; height: 10%; bottom: 22%; right: 3%; animation-duration: 12s; animation-delay: 2.6s; }
  @keyframes sway {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(12px, -7px); }
    50% { transform: translate(-6px, -14px); }
    75% { transform: translate(-10px, -4px); }
  }
  .trunk {
    position: absolute;
    width: 8px;
    height: 13%;
    bottom: 9%;
    left: 10%;
    border-radius: 999px;
    background: linear-gradient(to bottom, rgba(42, 67, 32, 0.85), transparent);
    animation: sway 11s ease-in-out infinite 0.6s;
  }
  .cloud {
    position: absolute;
    left: -28%;
    height: 10%;
    border-radius: 50%;
    background: rgba(221, 247, 225, 0.34);
    filter: blur(28px);
    animation: drift linear infinite;
  }
  .cl1 { width: 36%; top: 28%; animation-duration: 24s; }
  .cl2 { width: 28%; top: 45%; animation-duration: 31s; animation-delay: 8s; }
  .cl3 { width: 24%; top: 20%; animation-duration: 21s; animation-delay: 14s; }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(1380px); }
  }
  .spore {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 211, 1), rgba(171, 255, 176, 0.62) 42%, transparent 78%);
    animation: spore ease-in-out infinite;
  }
  @keyframes spore {
    0%, 100% { transform: translate(0, 0); opacity: 0.48; }
    30% { transform: translate(20px, -42px); opacity: 1; }
    62% { transform: translate(-18px, -82px); opacity: 0.72; }
  }
  .stage {
    position: absolute;
    top: 52%;
    left: 52%;
    z-index: 12;
    width: min(34%, 330px);
    aspect-ratio: 1 / 0.88;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    text-align: center;
    color: rgba(247, 255, 245, 0.92);
    border: 3px dashed rgba(247, 255, 245, 0.54);
    border-radius: 8px;
    background: rgba(13, 38, 27, 0.24);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 18px rgba(179, 255, 200, 0.14); }
    50% { box-shadow: 0 0 42px rgba(179, 255, 200, 0.34); }
  }
  .stage strong { display: block; font-size: 22px; margin-bottom: 8px; }
  .stage small { color: rgba(247, 255, 245, 0.68); line-height: 1.7; }
</style>
</head>
<body>
<main class="planet" id="planet" aria-label="浮空林环境">
  <div class="label">浮空林 / 稠密大气、弱光、空中森林</div>
  <div class="glow" aria-hidden="true"></div>
  <div class="canopy c1" aria-hidden="true"></div>
  <div class="canopy c2" aria-hidden="true"></div>
  <div class="canopy c3" aria-hidden="true"></div>
  <div class="canopy c4" aria-hidden="true"></div>
  <div class="canopy c5" aria-hidden="true"></div>
  <div class="trunk" aria-hidden="true"></div>
  <div class="cloud cl1" aria-hidden="true"></div>
  <div class="cloud cl2" aria-hidden="true"></div>
  <div class="cloud cl3" aria-hidden="true"></div>
  <section class="stage" id="creature-stage">
    <div><strong>异星生物舞台</strong><small>学生将在这里加入气囊、伞膜或共生光合型生物</small></div>
  </section>
</main>
<script>
  const planet = document.getElementById("planet");
  for (let i = 0; i < 32; i++) {
    const spore = document.createElement("i");
    spore.className = "spore";
    const size = 4 + Math.random() * 9;
    spore.style.width = `${size}px`;
    spore.style.height = `${size}px`;
    spore.style.left = `${6 + Math.random() * 88}%`;
    spore.style.top = `${20 + Math.random() * 70}%`;
    spore.style.animationDuration = `${5 + Math.random() * 8}s`;
    spore.style.animationDelay = `${Math.random() * 8}s`;
    planet.appendChild(spore);
  }
</script>
</body>
</html>
